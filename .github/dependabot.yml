version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    commit-message:
      prefix: deps
