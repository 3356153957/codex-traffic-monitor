name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Parse scripts with Windows PowerShell 5.1
        # Users run the build scripts from the default Windows PowerShell, which
        # reads BOM-less UTF-8 as the ANSI code page and breaks Chinese strings.
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in git ls-files '*.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "::error file=$file,line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if ($failed) { throw 'PowerShell 5.1 could not parse every script. Save scripts containing non-ASCII text as UTF-8 with BOM.' }
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $project = [xml](Get-Content ./src/CodexTrafficMonitor.csproj -Raw)
          if ($env:GITHUB_REF_NAME -ne "v$($project.Project.PropertyGroup.Version)") { throw 'Tag and application version differ.' }
      - name: Build, self-test, and package
        # Windows PowerShell 5.1 is what users run; it reads BOM-less UTF-8 as ANSI.
        shell: powershell
        run: ./build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP/codex-traffic-release"
      - name: Upload installer and portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/codex-traffic-release/*.exe
            ${{ runner.temp }}/codex-traffic-release/*.zip
            ${{ runner.temp }}/codex-traffic-release/SHA256SUMS.txt
